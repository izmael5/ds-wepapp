services:
  - type: web
    name: data-studio
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=2 --threads=4 --timeout=120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: /var/data/combined.db
      - key: SESSION_COOKIE_SECURE
        value: "1"
    disk:
      name: data-studio-data
      mountPath: /var/data
      sizeGB: 1
