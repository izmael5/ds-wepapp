<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Create account · Data Studio</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="/"><span class="brand-mark">D</span><span>data<span class="brand-light">studio</span></span></a><section class="auth-card"><div class="eyebrow">YOUR PRIVATE WORKSPACE</div><h1>Create your account</h1><p class="auth-subtitle">The first account is assigned administrator privileges.</p>{% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('register') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" placeholder="e.g. alex.smith"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="256" placeholder="At least 10 characters"><button class="button button-primary auth-submit" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></section><p class="auth-privacy">Your data is separated from other user accounts.</p></main></body></html>
