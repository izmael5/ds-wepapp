<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Sign in · Data Studio</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="/"><span class="brand-mark">D</span><span>data<span class="brand-light">studio</span></span></a><section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to your workspace</h1><p class="auth-subtitle">Access your private analytics workspace.</p>{% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="32"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button class="button button-primary auth-submit" type="submit">Sign in</button></form><p class="auth-switch">New to Data Studio? <a href="{{ url_for('register') }}">Create an account</a></p></section><p class="auth-privacy">Each account has a private dataset and upload history.</p></main></body></html>
