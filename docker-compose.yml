services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: company_sources_practice
      MYSQL_USER: analytics
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3307:3306"

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      SQLITE_PATH: /app/data/combined.db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: analytics
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SOURCE_DB: company_sources_practice
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    volumes:
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

volumes:
  mysql_data:
  app_data: